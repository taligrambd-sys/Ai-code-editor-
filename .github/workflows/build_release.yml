name: Android Release Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Random Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass android \
            -keypass android \
            -dname "CN=DeepSeek Studio, OU=Dev, O=Studio, L=City, S=State, C=US"

      - name: Build Release APK and App Bundle
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: android
          KEY_ALIAS: upload
          KEY_PASSWORD: android
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
